<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samper Consulting — Hors ligne</title>
  <style>
    body {
      background: #0f1a12;
      color: #e8e2d9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: #1a3a26;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      font-family: Georgia, serif;
      color: #e8e2d9;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 20px;
      font-weight: 400;
      margin: 0 0 12px;
      color: #82b27f;
    }
    p {
      font-size: 14px;
      color: #6b7a6e;
      line-height: 1.7;
      max-width: 280px;
      margin: 0 0 28px;
    }
    button {
      padding: 11px 24px;
      background: #1a3a26;
      color: #e8e2d9;
      border: 1px solid #2a5038;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="logo">SC</div>
  <h1>Vous êtes hors ligne</h1>
  <p>Vérifiez votre connexion internet et réessayez.</p>
  <button onclick="window.location.reload()">Réessayer</button>
</body>
</html>
