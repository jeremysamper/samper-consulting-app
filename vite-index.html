    <!-- IBM Plex Sans (texte, chiffres) + IBM Plex Serif (titres) : servies par
         l'app (public/fonts/ui, déclarées dans src/styles/fonts.css) et précachées
         par le service worker. Un seul préchargement : la police du texte. -->
    <link rel="preload" href="/fonts/ui/IBMPlexSans-latin-wght.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Pré-splash : le fond de l'écran de chargement (BRAND_COLORS.abysse,
         comme le lancement natif du manifest) entre le premier affichage et
         le premier rendu React (BootScreen, qui y trace le logo). Retiré par
         src/main.jsx dès que React a peint. Si le JavaScript tarde, le logo
         plein apparaît ici après 0,9 s, et BootScreen le reprend tel quel
         sans le retracer (PRE_SPLASH_LOGO_MS). Le tracé est celui de
         src/components/brand/markGeometry.js, à la taille du logo de
         BootScreen. -->
    <style>
      #pre-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000D13;
        transition: opacity 0.3s ease;
      }
      #pre-splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #pre-splash svg {
        display: block;
        width: clamp(76px, 21vw, 116px);
        height: clamp(76px, 21vw, 116px);
        opacity: 0;
        animation: pre-splash-logo 0.4s ease 0.9s forwards;
      }
      @keyframes pre-splash-logo {
        to { opacity: 1; }
      }
    </style>
