<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samper Consulting - Gestion culinaire</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (barre de statut Android + Chrome desktop) -->
    <meta name="theme-color" content="#003042" />

    <!-- iOS Safari — mode standalone (plein écran sans barre Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Samper" />

    <!-- iOS touch icons (PNG requis, pas SVG). Le suffixe -v2 est volontaire :
         il force la relecture des icônes chez les utilisateurs deja installes
         (voir scripts/gen-icons.mjs). -->
    <link rel="apple-touch-icon" href="/icons/icon-180-v2.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-144-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180-v2.png" />

    <!-- Android Chrome (bannière d'installation) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />

    <!-- Pré-splash : comble le trou blanc entre l'écran natif (manifest,
         fond #003042) et le premier rendu React (BootScreen, même fond).
         Retiré par src/main.jsx dès que React a peint. Les polygones sont
         la géométrie exacte de src/components/brand/markGeometry.js. -->
    <style>
      #pre-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 95% at 50% 36%, #00394c 0%, #003042 38%, #001620 100%);
        transition: opacity 0.3s ease;
      }
      #pre-splash.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="pre-splash" aria-hidden="true">
      <svg width="112" height="112" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <polygon points="512,512 683,341 853,512" fill="#175C82"/>
        <polygon points="512,512 853,512 683,683" fill="#EFE8DD"/>
        <polygon points="512,512 683,683 512,853" fill="#04222D"/>
        <polygon points="512,512 512,853 341,683" fill="#175C82"/>
        <polygon points="512,512 171,512 341,341" fill="#C9BCA3"/>
        <polygon points="512,512 341,341 512,171" fill="#175C82"/>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
