    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (barre de statut Android + Chrome desktop) -->
    <meta name="theme-color" content="#003042" />

    <!-- iOS Safari — mode standalone (plein écran sans barre Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jouanet" />

    <!-- iOS touch icons (PNG requis, pas SVG). Le suffixe -v4 est volontaire :
         il force la relecture des icônes chez les utilisateurs deja installes
         (voir scripts/gen-icons.mjs). -->

    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-144-v4.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180-v4.png" />

    <!-- Android Chrome (bannière d'installation) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- IBM Plex Sans (texte, chiffres) + IBM Plex Serif (titres) : servies par
         l'app (public/fonts/ui, déclarées dans src/styles/fonts.css) et précachées
         par le service worker. Un seul préchargement : la police du texte. -->
    <link rel="preload" href="/fonts/ui/IBMPlexSans-latin-wght.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Pré-splash : le fond de l'écran de chargement (BRAND_COLORS.abysse,
         comme les images de lancement iOS et le manifest) entre le premier
         affichage et le premier rendu React. Retiré par src/main.jsx dès que
         React a peint. Aucun logo ici : BootScreen est le seul à le dessiner,
         au centre. Le logo que le pré-splash montrait quand le démarrage
         tardait (iPad) se voyait une seconde en bas à droite à l'ouverture,
         avant celui du centre (constaté le 14.11.2026). -->
    <style>
      #pre-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: #000D13;
        transition: opacity 0.3s ease;
      }
      #pre-splash.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="pre-splash" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
