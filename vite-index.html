<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jouanet - Hôtellerie et restauration</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (barre de statut Android + Chrome desktop) -->
    <meta name="theme-color" content="#003042" />

    <!-- iOS Safari — mode standalone (plein écran sans barre Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jouanet" />

    <!-- iOS touch icons (PNG requis, pas SVG). Le suffixe -v4 est volontaire :
         il force la relecture des icônes chez les utilisateurs deja installes
         (voir scripts/gen-icons.mjs). -->
    <link rel="apple-touch-icon" href="/icons/icon-180-v4.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-144-v4.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180-v4.png" />

    <!-- Android Chrome (bannière d'installation) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- IBM Plex Sans (texte, chiffres) + IBM Plex Serif (titres) : servies par
         l'app (public/fonts/ui, déclarées dans src/styles/fonts.css) et précachées
         par le service worker. Un seul préchargement : la police du texte. -->
    <link rel="preload" href="/fonts/ui/IBMPlexSans-latin-wght.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Pré-splash : comble le trou blanc entre l'écran natif (manifest,
         fond #003042) et le premier rendu React (BootScreen, même fond).
         Retiré par src/main.jsx dès que React a peint. Le tracé est la
         géométrie exacte de src/components/brand/markGeometry.js (losange à
         pales, grille 24, motif à 66 % de la boîte). -->
    <style>
      #pre-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 95% at 50% 36%, #00394c 0%, #003042 38%, #001620 100%);
        transition: opacity 0.3s ease;
      }
      #pre-splash.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="pre-splash" aria-hidden="true">
      <svg width="112" height="112" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(4.08 4.08) scale(0.66)">
          <path d="M2.069 14.137L0.953 13.021A2.711 2.711 0 0 1 0.953 9.187L8.967 1.173A4.044 4.044 0 0 1 14.687 1.173L17.751 4.238A1.2 1.2 0 0 1 16.208 6.065L13.891 4.421C13.075 3.842 11.403 4.018 10.539 4.882L4.295 11.125A3.333 3.333 0 0 0 3.321 13.594A0.733 0.733 0 0 1 2.069 14.137ZM21.931 9.863L23.047 10.979A2.711 2.711 0 0 1 23.047 14.813L15.033 22.827A4.044 4.044 0 0 1 9.313 22.827L6.249 19.762A1.2 1.2 0 0 1 7.792 17.935L10.109 19.579C10.925 20.158 12.597 19.982 13.461 19.118L19.705 12.875A3.333 3.333 0 0 0 20.679 10.406A0.733 0.733 0 0 1 21.931 9.863ZM7.38 11.057L11.057 7.38A1.733 1.733 0 0 1 13.508 7.38L16.62 10.492A1.733 1.733 0 0 1 16.62 12.943L12.943 16.62A1.733 1.733 0 0 1 10.492 16.62L7.38 13.508A1.733 1.733 0 0 1 7.38 11.057Z" fill="#EFE8DD"/>
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
