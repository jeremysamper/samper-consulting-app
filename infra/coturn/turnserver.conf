# ================================================================
# Relais coturn de Samper Consulting : appels audio dans l'app (lot C2b,
# amendement A10 du brief). Serveur virtuel en Suisse chez Infomaniak.
#
# Gabarit : installer.sh remplace __DOMAINE__, ajoute external-ip si le
# serveur est derrière une traduction d'adresse, et l'installe dans
# /etc/relais-turn/turnserver.conf (lisible par tous, sans secret).
#
# Le secret partagé n'est PAS dans ce fichier. Il vit dans
# /etc/relais-turn/auth-secret (root seul, 0600) ; au démarrage du service,
# /usr/local/sbin/relais-turn-assembler écrit la configuration complète dans
# /run/relais-turn/turnserver.conf (en mémoire, 0600, lisible par le seul
# utilisateur du service).
#
# Options choisies pour coturn 4.6.1 (paquet de Debian 12 et d'Ubuntu 24.04),
# vérifiées sur examples/etc/turnserver.conf et README.turnserver de cette
# version. Une version plus récente de coturn rend implicites no-cli,
# no-tlsv1, no-tlsv1_1, no-rfc5780 et no-stun-backward-compatibility : elle
# les signale en avertissement (« Bad configuration format ») et démarre.
# ================================================================

# ── Écoute ─────────────────────────────────────────────────────────
# STUN et TURN en UDP et en TCP.
listening-port=3478
# TURN sur TLS (adresse turns: rendue par l'Edge Function appel-turn).
tls-listening-port=5349
# Pas de DTLS sur 5349/udp : le navigateur parle TLS sur TCP.
no-dtls
# Ports des relais (UDP), ouverts au pare-feu par installer.sh. Mille ports
# suffisent largement : un appel relayé en prend un ou deux.
min-port=49152
max-port=50151
# Relais UDP seulement : un navigateur ne demande pas de relais TCP (RFC 6062).
no-tcp-relay

# ── Identité et authentification ───────────────────────────────────
realm=__DOMAINE__
server-name=__DOMAINE__
fingerprint
# Identifiants temporaires (mécanisme REST de coturn) : nom
# "<expiration>:<pseudonyme>", mot de passe base64(HMAC-SHA1(secret, nom)),
# fabriqués par l'Edge Function appel-turn pour une personne active. Refusés
# une fois l'expiration passée. Le pseudonyme est une empreinte du compte
# calculée avec une clé qui n'est pas sur ce serveur : le journal ne nomme
# personne (note nLPD, R3).
use-auth-secret
# static-auth-secret : ajouté au démarrage, voir l'en-tête.
#
# La découverte d'adresse (STUN) répond sans identifiant, comme tout serveur
# STUN ; le relais (TURN) exige toujours un identifiant valide.

# ── TLS ────────────────────────────────────────────────────────────
# Copie du certificat Let's Encrypt, faite par
# /usr/local/sbin/relais-turn-certificat à chaque renouvellement.
cert=/etc/relais-turn/tls/fullchain.pem
pkey=/etc/relais-turn/tls/privkey.pem
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"

# ── Ce que le relais refuse de joindre ─────────────────────────────
# Le relais ne sert qu'entre deux appareils sur Internet : jamais vers le
# serveur lui-même (bouclage), un réseau privé, une adresse réservée ou de
# diffusion. Le bouclage est déjà refusé par défaut (allow-loopback-peers
# absent) ; il est listé quand même.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ── Plafonds ───────────────────────────────────────────────────────
# Allocations simultanées par compte (le temps est retiré du nom, le
# pseudonyme est stable pour un compte) : un appel en ouvre une à trois selon
# les transports que le navigateur essaie.
user-quota=6
# Allocations simultanées pour tout le serveur.
total-quota=120
# Débit par session, en octets par seconde, chaque sens à part :
# 64 000 o/s = 512 kbit/s, une dizaine de fois la voix Opus (audit C5,
# section 6). Une vidéo ou un tunnel sont freinés.
max-bps=64000
# Débit total du serveur : 4 000 000 o/s = 32 Mbit/s. coturn exige max-bps
# dès que bps-capacity est posé.
bps-capacity=4000000
stale-nonce=600
max-allocate-lifetime=3600

# ── Surface réduite ────────────────────────────────────────────────
# Pas de console telnet (ouverte par défaut en 4.6.1 sur 127.0.0.1:5766).
no-cli
# La version de coturn n'est pas annoncée.
no-software-attribute
# Pas de découverte du comportement NAT (réponses plus grosses, risque
# d'amplification), pas d'ancien format STUN.
no-rfc5780
no-stun-backward-compatibility
# Console web (web-admin) et métriques (prometheus) : non activées.

# ── Journaux ───────────────────────────────────────────────────────
# Un seul fichier, rien sur la sortie standard. Rotation quotidienne, sept
# jours gardés puis effacés (/etc/logrotate.d/relais-turn, posé par
# installer.sh). Ce qui y figure : LISEZMOI.md, « Ce que le serveur garde ».
log-file=/var/log/relais-turn/turnserver.log
simple-log
no-stdout-log
